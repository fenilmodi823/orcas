[project]
name = "orcas-backend"
version = "0.1.0"
description = "ORCAS simulation backend — FastAPI, local-only"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "sgp4>=2.23",
    "scikit-learn==1.6.1",  # pinned: object_classifier.joblib was trained with this exact version
    "joblib>=1.4",
    "numpy>=2.1",
    "scipy>=1.14",
    "apscheduler>=3.10",
    "pyarrow>=17.0",  # Parquet archival for the retention policy — Data-Strategy.md §7
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    # scripts/analysis/generate_ml_plots.py — regenerates the paper's figures.
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern requires Depends()/Query() as argument defaults —
# not the mutable-default footgun B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "sgp4.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/golden"]
asyncio_mode = "auto"

# Pyright/Pylance config lives in the workspace-root pyrightconfig.json, not
# here — a [tool.pyright] block in this file would shadow it for anything
# under backend/, giving two disagreeing sources of truth. See
# .vscode/settings.json's own comment on this.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
