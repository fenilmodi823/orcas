services:
  orcas-backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./ml_models:/app/ml_models
      - ./backend:/app/backend
    environment:
      - NASA_API_KEY=${NASA_API_KEY:-}
      - CELESTRAK_TLE_URL=${CELESTRAK_TLE_URL:-https://celestrak.org/NORAD/elements/gp.php}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SDT_COLLISION_MAX=60
      - SDT_PLOT3D_MAX=120
      - SDT_LIVE2D_MAX=100
      - SDT_ENABLE_2D=0
      - SDT_ENABLE_3D=0