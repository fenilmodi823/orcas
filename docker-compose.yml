services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orcas
      POSTGRES_PASSWORD: orcas
      POSTGRES_DB: orcas
    volumes:
      - orcas-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcas -d orcas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://orcas:orcas@postgres:5432/orcas
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://orcas:orcas@postgres:5432/orcas
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "python", "-c", "print('worker: nothing scheduled yet — Phase 2 adds OMM ingestion')"]

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - ./packages:/app/packages
    depends_on:
      - backend

volumes:
  orcas-postgres-data:
